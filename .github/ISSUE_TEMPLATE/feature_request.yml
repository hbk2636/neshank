name: Feature request
description: Suggest an improvement for Neshank
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This works fully offline and needs no account/cloud backend.
